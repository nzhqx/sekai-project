<!DOCTYPE html>
<html>
<head>
	<title>Project Sekai - Login</title>
	<style>
		body {
			background:linear-gradient(135deg, #00abc0, #f05090);
			font-family: sans-serif;
			display: flex;
			justify-content: center;
			align-items: center;
			height: 100vh;
			margin: 0;
		}
		.login-box {
			background-color: white;
			padding: 40px;
			border-radius: 20px;
			text-align: center;
			box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2;
			width: 320px;
			border: 2px solid #fff;
		}

		h2 { color: #333; margin-top: 0px; }

		input {
			display: block;
			width: 10%;
			margin: 10px 0;
			box-sizing: border-box;
			padding: 10px;
			border: 1px solid #ccc;
			border-radius: 5px;
		}

		.btn {
			display: block;
			margin-top: 20px;
			background-color: #00abc0;
			color: white;
			padding: 10px 20px;
			text-decoration: none;
			border-radius: 5px;
			font-weight: bold;
		}
	</style>
</head>
<body>

	<div class="login-box">
		<h2>Welcome to SEKAI</h2>
		<input type="text" placeholder="Username">
		<input type="password" placeholder="Password">
		<br>
		<a href="home.html" class="btn">Sign in</a>
	</div>

</body>
</html>
